<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSC Gaspar GFIG</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animation.css">
    <style>
        #content {
            display: grid;
            grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr 1fr 1fr 1fr;
            height: 80vh;
            
        }
        #foguete {
            grid-area: 2 / 5/ 3 / 7; 
            font-size: 4rem;
            animation-name: foguete;
            animation-duration: 4s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        #terra {
            grid-area: 2 / 6 / 2 / 6; 
            font-size: 6rem;
        }
    </style>
</head>
<body>
    <div class = menu>
        <img src="../images/gfig.png" alt="Logo do GFIG" id="logogfig" class = "menu-item" onclick="window.open('index.html', '_self')">
        <a href="#" onclick="window.open('sobre.html', '_self')" class="menu-item">Sobre</a>
        <a href="#" onclick="window.open('contato.html', '_self')" class="menu-item">Contato</a>
        <a href="#" onclick="window.open('faq.html', '_self')" class="menu-item">FAQ</a>
    </div>
    <div id="content">
        <p id="foguete" class="foguete">🚀</p>
        <p id = "terra" class = "terra">🌎</p>
    </div>
</body>
</html>
