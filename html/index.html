<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSC Gaspar GFIG</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animation.css">
    <style>
        #content {
            display: grid;
            grid-template: 1fr 0.8fr 0.3fr / 1fr 1fr 1fr 1fr 2fr 1fr;
            height: 80vh;
            
        }
        #foguete {
            grid-area: 2 / 5/ 3 / 6; 
            font-size: 4rem;
            animation-name: foguete;
            animation-duration: 4s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            
            
        }
        #terra {
            grid-area: 2 / 6 / 2 / 5; 
            font-size: 6rem;
            justify-self: center;
            
        }
        #vermaisButton {
            grid-area: 3 / 2 / 3 / 2; 
            font-size: 1rem;
            text-align: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            background-color: lightgray;
            color: black;
            border: 1px solid black;
            text-decoration: none;
            border-radius: 10px;
            
        }
        #info {
            grid-area: 1 / 1 / 3 / 4; 
            font-size: 1rem;
            text-align: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            
        }
    </style>
</head>
<body>
    <div class = menu>
        <img src="../images/gfig.png" alt="Logo do GFIG" id="logogfig" class = "menu-item" onclick="window.open('index.html', '_self')">
        <a href="#" onclick="window.open('sobre.html', '_self')" class="menu-item">Sobre</a>
        <a href="#" onclick="window.open('contato.html', '_self')" class="menu-item">Contato</a>
        <a href="#" onclick="window.open('faq.html', '_self')" class="menu-item">FAQ</a>
    </div>
    <div id="content">
        <p id="foguete" class="foguete">🚀</p>
        <p id = "terra" class = "terra">🌎</p>
        <p id="info" class="info">Informações<br> aaaaaaaaaa</p>
        <a href="sobre.html" id="vermaisButton">Ver Mais</a>
    </div>
</body>
</html>
